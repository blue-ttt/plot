<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>プロットをインポートする</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no">
    <link rel="stylesheet" href="https://blue-ttt.github.io/plot/program/style.css">
    <script src="https://blue-ttt.github.io/plot/program/i18n.js"></script>
  </head>
  <body>
    <h1>plotをインポート</h1>
    <p>デバイスに保存されたplotをMyPlotに保存し、再編集可能な形に変換します。</p>
    <!--- アップロード部分(本物は隠して、labelで関連つけたのでcssを指定) --->
    <label class="file-upload">
      <input type="file" accept=".png">
      <div class="upload-file-texts">
      <span class="material-symbols-outlined upload-rogo">upload</span>
      <p style="font-size:40px;">ファイルを選択</p>
      </div>
    </label>
    <h3>【ご注意】</h3>
    <ul>
    <li class="up-warning-text">ファイルのアップロード、管理はユーザー様の自己責任になります。</li>
    <li class="up-warning-text">本機能でのファイルのデータの損失などの責任は負いかねます。</li>
    <li class="up-warning-text">アップロード及び再編集可能なのは本サービス内で作成される独自の拡張子(.my-plot)のみとなっております。</li>
    </ul>

    <style>
      .file-upload{ display:flex; width:500px; height:200px; margin:0; padding:20px; background-color:#fff; color:#FCAF17; border:2px solid #FCAF17; border-radius:10px; transition:all 0.3s ease; }
      .file-upload:hover{ background-color:#FFF9E6; }
      .upload-rogo{ display:flex; border-radius:10px; width:70px; height:70px; padding:0; margin:auto; font-size:40px; background-color:#FCAF17; color:#FFF9E6; align-items:center; justify-content:center; }
      .upload-file-texts{ display:flex; flex-direction:column; align-items:center; justify-content:center; margin:auto; padding:0; }
      input[type="file"]{ display:none; }
      .up-warning-text{ color:#77787B; font-size:10px; }
    </style>
  </body>
</html>
