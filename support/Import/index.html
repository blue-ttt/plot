<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>プロットをインポートする</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no">
    <link rel="stylesheet" href="https://blue-ttt.github.io/plot/program/style.css">
    <script src="https://blue-ttt.github.io/plot/program/i18n.js"></script>
  </head>
  <body>
    <h1>plotをインポート</h1>
    <p>デバイスに保存されたplotをMyPlotに保存し、再編集可能な形に変換します。</p>
    <!--- アップロード部分(本物は隠して、labelで関連つけたのでcssを指定) --->
    <label class="file-upload">
      <input type="file" accept=".png">
      <span class="material-symbols-outlined upload-rogo">upload</span>
      <p style="font-size:50px;">ファイルを選択</p>
    </label>

    <style>
      .file-upload{ display:flex; width:500px; height:200px; margin:0; padding:0; background-color:#FCAF17; color:#fff; border-radius:10%; }
      .upload-rogo{ border-radius:10%; width:30px; height:30px; padding:0; margin:0; }
      input[type="file"]{ display:none; }
    </style>
  </body>
</html>
