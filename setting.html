<head>
  <title>設定</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="program/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
</head>

<body>
  <div class="WelcomeToSetting setting-cade">
    <span class="material-symbols-outlined">settings</span>
    <h1>設定へようこそ</h1>
  </div>
  <div class="all-setting-cade">
    <button class="setting-cade setting-type"><span class="material-symbols-outlined">home</span>一般</button>
    <button class="setting-cade setting-type"><span class="material-symbols-outlined">home</span>スタイル</button>
    <button class="setting-cade setting-type"><span class="material-symbols-outlined">home</span>キーボード</button>
    <button class="setting-cade setting-type"><span class="material-symbols-outlined">home</span>アプリ版</button>
  </div>
<div class="setting-page setting-cade">
  <p>設定</p>
</div>
<style>
  body{ background-color:#fdefd4; }
  .setting-cade{ background-color:#fff; border-radius:20px; box-shadow:0px 0px 10px 1px #C0C0C0; }
  .setting-page{ padding:30px 20px; margin:20px auto; width:90%; background-color:#fff; display:flex; flex-direction:center; }
  .setting-type{ display:flex; align-items:center; justify-content:center; border:1px solid #000; }
  .all-setting-cade{ display:flex; flex-direction:row; }
  .WelcomeToSetting{ display:flex; flex-direction:column; align-items:center; justify-content:center; width:500px; margin:20px auto; }
  .WelcomeToSetting .material-symbols-outlined{ background-color:#FCAF17; color:#fff; border-radius:10px; width:50px; height:50px; padding:0; margin:5px; display:flex; align-items:center; justify-content:center; }
</style>
</body>
