<!DOCTYPE html>
<html lang="ja">
<head>
 <meta charset="UTF-8">
 <title>plot 誰もが小さなアイディアを大きな創造に</title>
 <link rel="stylesheet" href="https://blue-ttt.github.io/plot/program/style.css">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <script src="https://blue-ttt.github.io/plot/program/fetch.js"></script>
 <script src="https://blue-ttt.github.io/plot/program/i18n.js"></script>
</head>
<body>
 <header>
  <div class="header">
   <img src="https://blue-ttt.github.io/plot/data/plot_icon_outline.png" style="width:30px; height:30px;"><span style="color:#fff;">plot</span>
   <a class="head-infolink" href=" ">特徴</a>
   <a class="head-infolink" href=" ">使い方</a>
   <a class="head-makebtn" href=" ">今すぐ作成</a>
  </div>
 </header>
 
 <div class="title">
  <div class="title_textarea">
   <span class="title-idea"><span>小さな</span><span class="title1"> 思いつき</span></span>
   <span class="title2">を</span>
   <span class="title-souzou"><span>大きな</span><span class="title3"> 創造へ</span></span>
  </div>
  <div class="title_video"><video src="" loop autoplay muted playsinline poster="https://blue-ttt.github.io/plot/data/plot-icon.png"></video></div>
 </div>
 
 <div>
  <h1 class="index index1">これまでにない<b>アイデア</b>を作る</h1>
  <div class="index1_cade_board">
   <div class="index1_cade" style="width:40%; background-color:#F75252; box-shadow:0px 0px 10px 2px #FF8181; --shadowColor:#FF8181;"><span class="material-symbols-outlined" style="color:#F75252;">fullscreen</span><b>無限なスペース</b><p>端のないノートやボードでアイデアを無限に広げましょう</p></div>
   <div class="index1_cade" style="width:60%; background-color:#F8AB21; box-shadow:0px 0px 10px 2px #FFBB41; --shadowColor:#FFBB41;"><span class="material-symbols-outlined" style="color:#F8AB21;">fullscreen</span><b>豊富なツール</b><p>ボードやノートだけでなく、人気の思考ツールや2D空間デザイン、目標作りなど簡単に書き込めます</p></div>
  </div>
 </div>
 
 <footer><div id="footer"></div></footer>
 <style>
  body{ padding:0; margin:0; }
  header{ width:100vw; padding:0; margin:0; }
  .header{ background-color:#FCAF17; width:60%; border-radius:30px; padding:5px; margin:auto; display:flex; flex-direction:row; align-items:center; justify-content:center; }
  .head-infolink{ padding:0; margin:0 10px; color:#fff; text-decoration:none; }
  .head-infolink:hover{ text-decoration:underline; }
  .head-makebtn{ padding:10px; margin:0 15px; background-color:#fff; color:#FCAF17; border-radius:30px; text-decoration:none; }
  
  .title{ padding:0; margin:20px; display:flex; flex-direction:row; }
  .title1{ color:#F067A6; font-size:50px; padding:0; margin:0; }
  .title2{ color:#000; font-size:30px; display:flex; align-items:center; }
  .title3{ font-size:50px; padding:0; margin:0; background:linear-gradient(to right, #4facfe 0%, #00f2fe 100%); -webkit-background-clip:text; background-clip:text;/*文字へ切り抜く*/ color:transparent; }
  .title-idea{ display:flex; flex-direction:column; }
  .title-souzou{ display:flex; flex-direction:column; }
  .title_textarea{ padding:0; margin:0; display:flex; flex-direction:row; }
  .title_video{ width:300px; border-radius:10px; box-shadow:1px 1px 10px 2px #8A8C8E; }

  .index{ background-color:#fff; padding:10px; margin:0; }
  .index1_cade_board{ padding:20px; display:flex; flex-direction:row; }
  
  .index1{ position:sticky; top:0px; }
  .index1_cade{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px; margin:15px; border-radius:20px; height:max-width; color:#fff; border:1px solid #fff; transition:all 0.2s ease-in-out; }
  .index1_cade b{ font-size:40px; }
  .index1_cade p{ font-size:20px; }
  .index1_cade .material-symbols-outlined{ background-color:#fff; font-size:50px; padding:5px; margin:0; border-radius:50%; }
  .index1_cade:hover{ transform:translateY(-3px); box-shadow:2px 0px 10px 2px var(--shadowColor); }

  @media(max-width:768px){
   .index{ background-color:#fff; padding:5px; margin:0; }
   .index1_cade{ width:90% !important; }
   .index1_cade_board{ padding:10px; }
  }
 </style>
 <script>
  i18nStart();
 </script>
</body>
</html>
