<!DOCTYPE html>
<html lang="ja">
<head>
 <meta charset="UTF-8">
 <title>plot 誰もが小さなアイディアを大きな創造に</title>
 <link rel="stylesheet" href="https://blue-ttt.github.io/plot/program/style.css">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <script src="https://blue-ttt.github.io/plot/program/fetch.js"></script>
 <script src="https://blue-ttt.github.io/plot/program/i18n.js"></script>
</head>
<body>
 <header>
  <div class="header">
   <p>plot</p>
   <a class="head-infolink" href=" ">特徴</a>
   <a class="head-infolink" href=" ">使い方</a>
   <a class="head-makebtn" href=" ">今すぐ作成</a>
  </div>
 </header>
 
 <div class="title">
  <span class="title-idea"><span>小さな</span><span class="title1">思いつき</span></span>
  <span class="title2">を</span>
  <span class="title-souzou"><span>大きな</span><span class="title3">創造へ</span></span>
 </div>

 <footer><div id="footer"></div></footer>
 
 <style>
  body{ padding:0; margin:0; }
  header{ width:100vw; padding:0; margin:0; }
  .header{ background-color:#FCAF17; width:60%; border-radius:30px; margin:auto; display:flex; flex-direction:row; align-items:center; justify-content:center; }
  .head-infolink{ padding:0; margin:0 10px; color:#fff; text-decoration:none; }
  .head-infolink:hover{ text-decoration:underline; }
  .head-makebtn{ padding:10px; margin:0 15px; background-color:#fff; color:#FCAF17; border-radius:30px; text-decoration:none; }
  
  .title{ padding:0; margin:20px; display:flex; flex-direction:row; }
  .title1{ color:#F067A6; font-size:50px; padding:0; margin:0; }
  .title2{ color:#000; font-size:30px; display:flex; align-items:center; }
  .title3{ font-size:50px; padding:0; margin:0; background:linear-gradient(to right, #4facfe 0%, #00f2fe 100%); -webkit-background-clip:text; background-clip:text;/*文字へ切り抜く*/ color:transparent; }
  .title-idea{ display:flex; flex-direction:column; }
  .title-souzou{ display:flex; flex-direction:column; }
  
  .startbutton{
   display: inline-block;
   color:#fff;
   background-color:#FCAF17;
   width:100%;
   padding:20px;
   text-decoration:none;
   border-radius:30px;
   margin:5px;
   font-size:30px;
   box-shadow:1px 1px 5px 2px #a38103;
  }
  
  .aboutbutton{
   display: inline-block;
   color:#fff;
   background-color:#FFD400;
   width:100%;
   padding:20px;
   text-decoration:none;
   border-radius:30px;
   margin:5px;
  }
  
  /* 動くアニメーションの中身を定義 */
 @keyframes softFloat {
  0% {
    transform:scale(1);     
    box-shadow:0px 0px 5px 2px #FFD400; /* 普通 */
  }
  50% {
    transform:scale(1.1);    /* 変化 */
    box-shadow:0px 0px 10px 2px #FFD400; 
   }
  100% {
    transform:scale(1);       /* 普通 */
    box-shadow:0px 0px 5px 2px #FFD400;
   }
 }

  /* 動くボタンのスタイル */
  .move-animation {
   animation: softFloat 3s ease-in-out infinite; /* 3秒かけて、滑らかに、無限に繰り返す */
   }
  
  .startbutton:hover{ transition:all 0.3s ease; color:#fff; background-color:#fcd238; box-shadow:1px 5px 10px 2px #a38103; transform:translateY(-4px); }
  
 </style>
 <script>
  i18nStart();
 </script>
</body>
</html>
