<head>
 <meta charset="UTF-8">
 <title>plot 誰もが小さなアイディアを大きな創造に</title>
 <link rel="stylesheet" href="https://blue-ttt.github.io/plot/program/style.css">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <script src="https://blue-ttt.github.io/plot/program/fetch.js"></script>
 <script src="https://blue-ttt.github.io/plot/program/i18n.js"></script>
</head>
<body>

<div class="title">
 <h1>思いつき</h1><h2>を</h2><h1>創造へ</h1>
</div>

 <footer ><div id="footer"></div></footer>
 
 <style>
  
  .title{
    text-align: center;
    background-color:#fff;
  }
  
  .startbutton{
   display: inline-block;
   color:#fff;
   background-color:#FCAF17;
   width:100%;
   padding:20px;
   text-decoration:none;
   border-radius:30px;
   margin:5px;
   font-size:30px;
   box-shadow:1px 1px 5px 2px #a38103;
  }
  
  .aboutbutton{
   display: inline-block;
   color:#fff;
   background-color:#FFD400;
   width:100%;
   padding:20px;
   text-decoration:none;
   border-radius:30px;
   margin:5px;
  }
  
  /* 動くアニメーションの中身を定義 */
 @keyframes softFloat {
  0% {
    transform:scale(1);     
    box-shadow:0px 0px 5px 2px #FFD400; /* 普通 */
  }
  50% {
    transform:scale(1.1);    /* 変化 */
    box-shadow:0px 0px 10px 2px #FFD400; 
   }
  100% {
    transform:scale(1);       /* 普通 */
    box-shadow:0px 0px 5px 2px #FFD400;
   }
 }

  /* 動くボタンのスタイル */
  .move-animation {
   animation: softFloat 3s ease-in-out infinite; /* 3秒かけて、滑らかに、無限に繰り返す */
   }
  
  .startbutton:hover{
   transition:all 0.3s ease;/* 滑らかに動くようにする */
   color:#fff;
   background-color:#fcd238;
   box-shadow:1px 5px 10px 2px #a38103; /* 影 */
   transform:translateY(-4px);
  }
  
 </style>
 <script>
  i18nStart();
 </script>
</body>
