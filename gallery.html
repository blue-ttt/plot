<html lang="ja">
<head>
  <title>ギャラリー</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://blue-ttt.github.io/plot/program/style.css">
  <script src="https://blue-ttt.github.io/plot/program/fetch.js"></script>
  <script src="https://blue-ttt.github.io/plot/program/i18n.js"></script>
</head>
<body>
  <script>
    const GalleryData = [
      { title: "パーティ会場", info: "素敵なパーティ会場のレイアウトを設計しましょう", id: "G_0001", color: "#EF4123", icon: "celebration", tag: "spatial_design", },
      { title: "フィッシュボーン", info: "なぜ？と思ったら骨を増やし、根本的な原因を解決しましょう", id: "G_0002", color: "#6495ED", icon: "pet_supplies", tag: "thinking_tools", },
    ]
  </script>
  <div id="navi"></div>
  <h1 style="padding:0; margin:10px 5px;">ギャラリー</h1>
  <h3 style="padding:0; margin:10px 5px;">カジュアル</h3>
  <button class="c-gallery-cade"><span class="material-symbols-outlined c-gallery-icon">star_shine</span><span class="c-gallery-card-title">サプライズ</span><span class="c-gallery-card-info">plotギャラリーからランダムで選びます！</span></button>
  
  <h3 style="padding:0; margin:10px 5px;">おすすめ</h3>
    <div class="Gallery_Cades" id="AllGallery"></div>
  
  <div id="footer"></div>
  <style>
    .Gallery_Cades{ display:flex; flex-direction:row; flex-wrap:wrap; }
    
    .gallery-cade{ display:flex; flex-direction:column; justify-content:center; align-items:center; padding:5px; margin:20px; border:none; background-color:var(--color); color:#fff; border-radius:10px; width:200px; height:170px; cursor:pointer; transition:all 0.4s ease-out; }
    .gallery-cade:hover{ color:#fff; }
    .gallery-cade:active{ box-shadow:1px 2px 5px 1px #8A8C8E; transform:translateY(-3px); }
    .gallery-card-title{ transition:all 0.4s ease-out; font-size:17px; color:#fff; }
    .gallery-cade:hover .gallery-card-title{ transform:translateY(-20px); color:#fff; }
    .gallery-card-info{ display:none; color:var(--color); transition:all 0.4s ease-out; font-size:12px; }
    .gallery-cade:hover .gallery-card-info{ display:flex; justify-content:center; align-items:center; color:#fff; transform:translateY(-5px); }
    /* 下はgoogleアイコンが含まれていて,flexだと位置計算が優先されるので,gridを使う */
    .gallery-icon{ display:grid; place-items: center; border-radius:50%; background-color:#fff; color:var(--color); width:50px; height:50px; margin:0; padding:0; transition:all 0.4s ease-out; }
    .gallery-cade:hover .gallery-icon{ background-color:#fff; color:var(--color); transform:translateY(-20px) scale(1.1) rotate(-20deg); }
    
    /* --- カジュアル部分 --- */
    .c-gallery-cade{ display:flex; flex-direction:column; justify-content:center; align-items:center; padding:5px; margin:20px; border:none; background-color:#FCAF17; color:#fff; border-radius:10px; width:200px; height:170px; cursor:pointer; transition:all 0.4s ease-out; }
    .c-gallery-cade:hover{ color:#fff; }
    .c-gallery-cade:active{ box-shadow:1px 2px 5px 1px #8A8C8E; transform:translateY(-3px); }
    .c-gallery-card-title{ transition:all 0.4s ease-out; font-size:17px; color:#fff; }
    .c-gallery-cade:hover .c-gallery-card-title{ transform:translateY(-20px); color:#fff; }
    .c-gallery-card-info{ display:none; color:#FCAF17; transition:all 0.4s ease-out; font-size:12px; }
    .c-gallery-cade:hover .c-gallery-card-info{ display:flex; justify-content:center; align-items:center; color:#fff; transform:translateY(-5px); }
    /* 下はgoogleアイコンが含まれていて,flexだと位置計算が優先されるので,gridを使う */
    .c-gallery-icon{ display:grid; place-items: center; border-radius:50%; background-color:#fff; color:#FCAF17; width:50px; height:50px; margin:0; padding:0; transition:all 0.4s ease-out; }
    .c-gallery-cade:hover .c-gallery-icon{ background-color:#fff; color:#FCAF17; transform:translateY(-20px) scale(1.1) rotate(-20deg); }
  </style>
  <script>
    function SearchGallery (G_SearchFilter){
      const searchResult = GalleryData.filter(item => 
        item.title.includes(G_SearchFilter));
      
      const gallery_html = searchResult.map(item => `
        <button class="gallery-cade" style="--color:${item.color}">
          <span class="material-symbols-outlined gallery-icon">${item.icon}</span>
          <span class="gallery-card-title">${item.title}</span>
          <span class="gallery-card-info">${item.info}</span>
        </button>
      `).join('');
      
      const input_contents_gallery = document.getElementById('AllGallery');
      input_contents_gallery.innerHTML = gallery_html;
    };
   //初期ページ(全て表示)
    SearchGallery("");
  </script>
</body>
</html>
