<html lang="ja">
<head>
  <title>ギャラリー</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
  <h1>ギャラリー</h1>
  <button class="gallery-cade" data-tooltip="ランダムでプロットを表示!"><span class="material-symbols-outlined gallery-icon">star_shine</span><span class="gallery-card-title">サプライズ</span><span class="gallery-card-info">ランダムで選びます！</span></button>

  <style>
    .gallery-cade{ display:flex; flex-direction:column; justify-content:center; align-items:center; padding:5px; margin:20px; border:none; background:none; color:#000; border-radius:10px; width:150px; height:150px; cursor:pointer; transition:all 0.2s ease-in-out; }
    .gallery-cade:hover{ background-color:#FCAF17; color:#fff; }
    .gallery-cade:hover .gallery-icon{ background-color:#fff; color:#FCAF17; transform:translateY(-20px); }
    .gallery-cade:hover .gallery-card-title{ transform:translateY(-20px); }
    .gallery-card-info{ display:none; }
    .gallery-cade:hover .gallery-card-info{ display:flex; justify-content:center; align-items:center; }
    .gallery-icon{ display:flex; border-radius:50%; background-color:#FCAF17; color:#fff; width:50px; height:50px; margin:0; padding:0; justify-content:center; align-items:center; transition:all 0.2s ease-in-out; }
  </style>
</body>
</html>
