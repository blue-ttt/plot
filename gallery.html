<html lang="ja">
<head>
  <title>ギャラリー</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://blue-ttt.github.io/plot/program/style.css">
  <script src="https://blue-ttt.github.io/plot/program/fetch.js"></script>
  <script src="https://blue-ttt.github.io/plot/program/i18n.js"></script>
</head>
<body>
  <script>
    const GalleryData = [
      { title: "パーティ会場", info: "パーティ会場のレイアウトを設計しましょう", id: "G_0001", color: "#EF4123", icon: "celebration", tag: "spatial_design", start: "おすすめ", },
    ]
  </script>
  <div id="navi"></div>
  <h1 style="padding:0; margin:10px 5px;">ギャラリー</h1>
  <h3 style="padding:0; margin:10px 5px;">カジュアル</h3>
  <button class="gallery-cade"><span class="material-symbols-outlined gallery-icon">star_shine</span><span class="gallery-card-title">サプライズ</span><span class="gallery-card-info">plotギャラリーからランダムで選びます！</span></button>
  
  <h3 style="padding:0; margin:10px 5px;">おすすめ</h3>
  <div class="gallery_cades">
    <div id="AllGallery"></div>
  </div>
  
  <div id="footer"></div>
  <style>
    .gallery_cades{ display:flex; flex-direction:row; flex-wrap:wrap; }
    
    .gallery-cade{ display:flex; flex-direction:column; justify-content:center; align-items:center; padding:5px; margin:20px; border:none; background-color:var(--color); color:#fff; border-radius:10px; width:150px; height:170px; cursor:pointer; transition:all 0.3s ease-out; }
    .gallery-cade:hover{ color:#fff; }
    .gallery-cade:hover .gallery-icon{ background-color:#fff; color:var(--color); transform:translateY(-20px); }
    .gallery-card-title{ transition:all 0.3s ease-out; font-size:17px; color:#fff; }
    .gallery-cade:hover .gallery-card-title{ transform:translateY(-20px); color:#fff; }
    .gallery-card-info{ display:none; color:#fff; transition:all 0.3s ease-out; font-size:12px; }
    .gallery-cade:hover .gallery-card-info{ display:flex; justify-content:center; align-items:center; transform:translateY(-5px); }
    .gallery-icon{ display:flex; border-radius:50%; background-color:#fff; color:var(--color); width:50px; height:50px; margin:0; padding:0; justify-content:center; align-items:center; transition:all 0.3s ease-out; }
  </style>
  <script>
    function SearchGallery (G_SearchFilter){
      const searchResult = GalleryData.filter(item => 
        item.title.includes(G_SearchFilter));
      
      const gallery_html = searchResult.map(item => `
        <button class="gallery-cade" style="--color:${item.color}">
          <span class="material-symbols-outlined gallery-icon">${item.icon}</span>
          <span class="gallery-card-title">${item.title}</span>
          <span class="gallery-card-info">${item.info}</span>
        </button>
      `).join('');
      
      const input_contents_gallery = document.getElementById('AllGallery');
      input_contents_gallery.innerHTML = gallery_html;
    };
   //初期ページ(全て表示)
    SearchGallery("");
  </script>
</body>
</html>
