<!DOCTYPE html>
<html lang="ja">
<head>
  <title>ギャラリー</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://blue-ttt.github.io/plot/program/style.css">
  <script src="https://blue-ttt.github.io/plot/program/fetch.js"></script>
  <script src="https://blue-ttt.github.io/plot/program/i18n.js"></script>
</head>
<body>
  <script>
    const GalleryData = [
      { title: "パーティ会場", info: "素敵なパーティ会場のレイアウトを設計しましょう", other: "空間デザイン", id: "G_0001", color: "#EF4123", icon: "celebration", tag: "spatial_design", },
      { title: "フィッシュボーン", info: "なぜ？と思ったら骨を増やし、根本的な原因を解決しましょう", other: "思考ツール", id: "G_0002", color: "#6495ED", icon: "pet_supplies", tag: "thinking_tools", },
      { title: "相関図", info: "人物と人物の関係の全体像をまとめましょう", other: "関係性", id: "G_0003", color: "#6F51A1", icon: "groups", tag: "bulletin_board", },
      { title: "作文", info: "書くことを明確にし、完璧な作文を作りましょう", other: "文章 国語 フレーズ", id: "G_0004", color: "#2DCFBB", icon: "format_image_left", tag: "thinking_tools", },
      { title: "方眼ノート", info: "図や文字の書きやすい方眼で、アイデアをまとめましょう", other: "四角", id: "G_0005", color: "#20B5C1", icon: "grid_on", tag: "notebook", },
      { title: "掲示板", info: "情報を付けて付けて 繋げて繋げて 整理しましょう", other: "ボード", id: "G_0006", color: "#976F3A", icon: "format_image_left", tag: "bulletin_board", },
      { title: "ロードマップ", info: "目標は大きく！そして達成するためにやる事を具体化しましょう", other: "目標に向けて todo", id: "G_0007", color: "#FFC100", icon: "route", tag: "roadmap", },
      { title: "ホワイトボード", info: "枠のない空間で発想を広げていきましょう", other: "", id: "G_0008", color: "#97C6FF", icon: "jamboard_kiosk", tag: "whiteboard", },
      { title: "黒板(緑)", info: "制限のない授業を始めましょう", other: "学校", id: "G_0009", color: "#126C0A", icon: "rectangle", tag: "whiteboard", },
      { title: "ミーティングノート", info: "会議でのアイデアや決定事項を記録しましょう", other: "ビジネス タスク", id: "G_0010", color: "#f77a36", icon: "co_present", tag: "notebook", },
    ]
  </script>
  <div id="navi"></div>
  <h1 style="padding:0; margin:15px 5px;">ギャラリー</h1>
  <h3 style="padding:0; margin:10px 5px;">コレクション</h3>
  <div class="Gallery_Cades">
    <button class="c-gallery-cade" style="--gallery_cadeTop_color:#FCAF17;"><span class="material-symbols-outlined c-gallery-icon">star_shine</span><div class="c-gallery-cade-text"><span class="c-gallery-card-title">サプライズ！</span><span class="c-gallery-card-info">plotギャラリーからランダムで選びます！</span></div></button>
    <button class="c-gallery-cade" style="--gallery_cadeTop_color:#C77EB5;"><span class="material-symbols-outlined c-gallery-icon">psychology_alt</span><div class="c-gallery-cade-text"><span class="c-gallery-card-title">思考ツール</span><span class="c-gallery-card-info">課題に向けて思考力を大いに引き出すツールです</span></div></button>
    <button class="c-gallery-cade" style="--gallery_cadeTop_color:#6495ED;"><span class="material-symbols-outlined c-gallery-icon">menu_book</span><div class="c-gallery-cade-text"><span class="c-gallery-card-title">ノート</span><span class="c-gallery-card-info">端のない膨大なノートで知識やアイデアを広げましょう</span></div></button>
  </div>
  
  <h3 style="padding:0; margin:10px 5px;">おすすめ</h3>
  <input type="search" placeholder="ギャラリーを検索..." name="SearchGallery_text" class="SearchGallery_Text" oninput="SearchGallery(this.value);">
    <div class="Gallery_Cades" id="AllGallery"></div>

  <div class="not_found" style="display:none;">
    <img src="https://blue-ttt.github.io/plot/data/404.png" style="height:auto; width:200px;">
    <h2>ギャラリーが見つかりません</h2>
    <p>入力内容を変えてみて下さい</p>
  </div>
  
  <div id="footer"></div>
  <style>
    .SearchGallery_Text{ display:flex; justify-content:flex-end; width:300px; height:40px; border-radius:20px; border:1px solid #000; padding:3px 5px; margin:3px; }
    
    .Gallery_Cades{ display:flex; flex-direction:row; justify-content:center; flex-wrap:wrap; }
    
    .gallery-cade{ display:flex; flex-direction:column; justify-content:center; align-items:center; padding:5px; margin:20px; border:none; background-color:var(--color); color:#fff; border-radius:10px; width:200px; height:170px; cursor:pointer; transition:all 0.4s ease-out; }
    .gallery-cade:hover{ color:#fff; }
    .gallery-cade:active{ box-shadow:0px 0px 5px 1px #8A8C8E; transform:scale(1.1); }
    .gallery-card-title{ transition:all 0.4s ease-out; font-size:17px; color:#fff; }
    .gallery-cade:hover .gallery-card-title{ transform:translateY(-20px); color:#fff; }
    .gallery-card-info{ display:none; color:var(--color); transition:all 0.4s ease-out; font-size:12px; }
    .gallery-cade:hover .gallery-card-info{ display:flex; justify-content:center; align-items:center; color:#fff; }
    /* 下はgoogleアイコンが含まれていて,flexだと位置計算が優先されるので,gridを使う */
    .gallery-icon{ display:grid; place-items:center; border-radius:50%; background-color:#fff; color:var(--color); width:50px; height:50px; aspect-ratio:1/1; margin:3px; padding:0; transition:all 0.4s ease-out; }
    .gallery-cade:hover .gallery-icon{ background-color:#fff; color:var(--color); transform:translateY(-20px) scale(1.1) rotate(-20deg); }
    
    /* --- トップ部分 --- */
    .c-gallery-cade{ display:flex; flex-direction:row; align-items:center; padding:5px; margin:20px; border:none; background-color:#fff; color:#fff; border:1px solid var(--gallery_cadeTop_color); border-radius:10px; width:250px; height:120px; cursor:pointer; transition:all 0.3s ease-out; }
    .c-gallery-cade:hover{ color:#fff; background-color:var(--gallery_cadeTop_color); }
    .c-gallery-cade:active{ box-shadow:0px 0px 5px 1px #8A8C8E; transform:scale(1.1); }
    .c-gallery-cade-text{ display:flex; flex-direction:column; justify-content:flex-start; }
    .c-gallery-card-title{ display:flex; justify-content:flex-start; transition:all 0.3s ease-out; font-size:17px; color:var(--gallery_cadeTop_color); }
    .c-gallery-cade:hover .c-gallery-card-title{ transform:translateY(-20px); color:#fff; }
    .c-gallery-card-info{ display:none; color:#FCAF17; transition:all 0.3s ease-out; font-size:12px; }
    .c-gallery-cade:hover .c-gallery-card-info{ display:flex; align-items:center; justify-content:flex-start; color:#fff; transform:translateY(-5px); }
    /* 下はgoogleアイコンが含まれていて,flexだと位置計算が優先されるので,gridを使う */
    .c-gallery-icon{ display:grid; place-items:center; border-radius:50%; background-color:var(--gallery_cadeTop_color); color:#fff; border:1px solid var(--gallery_cadeTop_color); width:50px; height:50px; aspect-ratio:1/1; margin:3px; padding:0; transition:all 0.3s ease-out; }
    .c-gallery-cade:hover .c-gallery-icon{ background-color:#fff; color:var(--gallery_cadeTop_color); transform:rotate(-20deg); }
  </style>
  <script>
    function SearchGallery (G_SearchFilter){
      const searchResult = GalleryData.filter(item => 
        item.title.includes(G_SearchFilter) ||
        item.info.includes(G_SearchFilter) ||
        item.tag.includes(G_SearchFilter) ||
        item.other.includes(G_SearchFilter)
         );
      // 検索結果があるか ないか
      const search_there_any = searchResult.length > 0;
      const message = document.querySelector('.not_found');
      if (search_there_any){
        message.style.display = "none";
      } else {
        message.style.display = "flex";
      }
      
      const gallery_html = searchResult.map(item => `
        <button class="gallery-cade" style="--color:${item.color}">
          <span class="material-symbols-outlined gallery-icon">${item.icon}</span>
          <span class="gallery-card-title">${item.title}</span>
          <span class="gallery-card-info">${item.info}</span>
        </button>
      `).join('');
      
      const input_contents_gallery = document.getElementById('AllGallery');
      input_contents_gallery.innerHTML = gallery_html;
    };
   //初期ページ(全て表示)
    SearchGallery("");
  </script>
</body>
</html>
