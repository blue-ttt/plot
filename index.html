<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>plot 誰もが小さなアイディアを大きな創造に</title>
  <link rel="stylesheet" href="https://blue-ttt.github.io/plot/program/style.css">
  <script src="https://blue-ttt.github.io/plot/program/fetch.js"></script>
  <script src="https://blue-ttt.github.io/plot/program/i18n.js"></script>
</head>

<body>
  <nav><div id="navi"></div></nav>

  <h1>ホーム-プロット</h1>
  <h2>新しいアイデアを形にしましょう！</h2>
  <div class="make-new-plots">
   <div class="make-new-plots-BtnAndText"><button class="btn-make-plot make-plot-blank" style="color:#000; background-color:#f5f5f5;"><span class="material-symbols-outlined">new_window</span></button><p>空白</p></div>
   <div class="make-new-plots-BtnAndText"><button class="btn-make-plot make-plot-whiteboard" style="color:#000; background-color:#f5f5f5;"><span class="material-symbols-outlined">jamboard_kiosk</span></button><p>ホワイトボード</p></div>
   <div class="make-new-plots-BtnAndText"><button class="btn-make-plot make-plot-bulletinboard" style="color:#fff; background-color:#9A6229;"><span class="material-symbols-outlined">dashboard</span></button><p>掲示板</p></div>
   <div class="make-new-plots-BtnAndText"><button class="btn-make-plot make-plot-thinkingtools" style="color:#fff; background-color:#C77EB5;"><span class="material-symbols-outlined">category</span></button><p>思考ツール</p></div>
   <div class="make-new-plots-BtnAndText"><button class="btn-make-plot make-plot-spacedesign" style="color:#fff; background-color:#00AE95;"><span class="material-symbols-outlined">meeting_room</span></button><p>空間デザイン</p></div>
   <div class="make-new-plots-BtnAndText"><button class="btn-make-plot make-plot-thinkingtools" style="color:#fff; background-color:#007B49;"><span class="material-symbols-outlined">flowchart</span></button><p>フローチャート</p></div>
   <div class="make-new-plots-BtnAndText"><button class="btn-make-plot make-plot-roadmap" style="color:#fff; background-color:#FBB034;"><span class="material-symbols-outlined">route</span></button><p>ロードマップ</p></div>
   <div class="make-new-plots-BtnAndText"><button class="btn-make-plot make-plot-more" style="color:#000; background-color:#f5f5f5;"><span class="material-symbols-outlined">more_horiz</span></button><p>もっと見る</p></div>
  </div>
  
  <h3>ピックアップ</h3>
  <div class="imgcursor">
    <button class="imgcursor-leftcursor" data-tooltip="前のピックアップへ"><span class="material-symbols-outlined">chevron_left</span></button>
    <button class="imgcursor-rightcursor" data-tooltip="次のピックアップへ"><span class="material-symbols-outlined">chevron_right</span></button>
    <div class="imgcursor-imgs">
    <div class="imgcursor-contents"><a href="https://blue-ttt.github.io/plot/program/footer"><img src="https://blue-ttt.github.io/plot/data/plot-ad1.png"></a></div>
    <div class="imgcursor-contents"><a href="https://blue-ttt.github.io/plot/program/footer"><img src="https://blue-ttt.github.io/plot/data/plot-ad1.png"></a></div>
    <div class="imgcursor-contents"><a href="https://blue-ttt.github.io/plot/program/footer"><img src="https://blue-ttt.github.io/plot/data/plot-ad1.png"></a></div>
    <div class="imgcursor-contents"><a href="https://blue-ttt.github.io/plot/program/footer"><img src="https://blue-ttt.github.io/plot/data/plot-ad1.png"></a></div>
   </div>
  </div>
  <hr>
  <h3>最近形にしたアイデア</h3>
  <a href="https://blue-ttt.github.io/plot/myplot.html">もっと見る</a>
  <hr>
  
   <footer>
    <a href="" data-tooltip="ページ上へ戻る" class="back-to-top"><img src="https://blue-ttt.github.io/plot/data/plot-BackToTop.png" alt="ページ上に戻る" style="width:100px; height:auto;"></a>
    <div id="footer"></div>
   </footer>
 <style>
   body{ padding-left:70px;/* navの分開ける */ }
   h1{ text-align:center; }
   h2{ text-align:center; }
   .back-to-top{ position:fixed; right:30px; bottom:30px; z-index:240; }
   .btn-make-plot{ border-radius:50%; border:none; font-size:30px; width:50px; aspect-ratio:1/1; padding:0; margin:5px 20px; transition:all 0.2s ease-in-out; }
   .btn-make-plot:hover{ transform:scale(1.1); }
   .make-new-plots-BtnAndText{ flex-direction:column; justify-content:center; padding:0; text-align:center; }
   .make-new-plots{ display:flex; flex-direction:row; padding:0; }
   .make-new-plots p{ font-size:10px; }

   .imgcursor-contents img{ width:300px; height:auto; padding:0; margin:5px; }
   .imgcursor-imgs{ display:flex; flex-direction:row; transition:all 0.5s ease-in-out; overflow:hidden; overflow-x:auto; }
   
   footer{ margin:0; padding:0; width:100%; }
   nav{ position:fixed; left:0; margin:0; position:fixed; }
    
  @media(max-width:768px){
    body{ padding-left:0; padding-bottom:50px;/*navの左余白を消し,下に作る*/ }
    nav{ bottom:40px; width:100vw; height:50px; position: fixed; }
    .back-to-top{ position:fixed; right:10px; bottom:35px; z-index:240; }
    }
  </style>
</body>
</html>
