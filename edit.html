<head>
 <title>編集 plotコンテンツ</title>

 <meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no">

<script>
 /* 最初に変数を設定（エラー防止） */
  let nowmode = 0;
  let nowtool = 0;
 /* 要素のドラック&ドロップ部分 */
  let isDragging = false; 
  let diffX = 0;
  let diffY = 0;
 /* データリスト */
 let DataList = [];
</script>

<body>
 <header>
  <ul>
   <li><div class="rogo"><img src="https://blue-ttt.github.io/plot/data/rogo.png"></div></li>
   <!---　題名入力欄 --->
   <li><div class="title-edit" contenteditable="true" role="textbox" aria-label="ドキュメントのタイトル">
    無題のプロット
   </div></li>
   
   <li><button data-tooltip="ファイル"><span class="material-symbols-outlined">folder</span></button></li>
   <li><button class="set-btn" data-tooltip="設定"><span class="material-symbols-outlined">settings</span></button></li>
   <li><button class="help-btn" data-tooltip="ヘルプ"><span class="material-symbols-outlined">help</span></button></li>
   
   <li class="right"><button class="new" data-tooltip="サーバーへ変更を反映させる"><span class="material-symbols-outlined">update</span>同期</button></li>
   <li><button class="share" data-tooltip="アイデアを共有する"><span class="material-symbols-outlined">share</span>共有</button></li>
  </ul>
 </header>
 
 <div class="ai-btn"><button data-tooltip="AI分析"><span class="material-symbols-outlined">smart_toy</span></button></div>
 
 <div class="mini-study">
  <button class="mini-study-close" data-tooltip="閉じる"><span class="material-symbols-outlined">close</span></button>
  <iframe src="https://blue-ttt.github.io/plot/study/index" width="800px" height="100%"></iframe>
 </div>
 <div class="mini-setting">
  <button class="mini-setting-close" data-tooltip="閉じる"><span class="material-symbols-outlined">close</span></button>
  <iframe src="https://blue-ttt.github.io/plot/setting.html" width="800px" height="100%"></iframe>
 </div>
 <!---読み込みアニメーション---><div class="loading"><lottie-player src="https://blue-ttt.github.io/plot/data/sandy_loading.json" background="transparent" speed="1" style="width: 200px; height: 200px;" loop autoplay></lottie-player></div>

 <div class="toolbar">
  <ul>
   <li><button class="tools edit-move" data-tooltip="操作する" ><script>nowtool = "edit";</script><span class="material-symbols-outlined">arrow_selector_tool</span></button></li>
   <li><button class="tools edit-write" data-tooltip="筆記用具で描く"><span class="material-symbols-outlined">ink_pen</span></button></li>
   <li><button class="tools edit-delete" data-tooltip="消しゴムで消す"><span class="material-symbols-outlined">ink_eraser</span></button></li>
   <li><button class="tools edit-note" data-tooltip="付箋を追加"><span class="material-symbols-outlined">note_stack</span></button></li>
   <li><button class="tools edit-pin" data-tooltip="ピンを追加"><span class="material-symbols-outlined">add_location</span></button></li>
   <li><button class="tools edit-material" data-tooltip="素材を追加"><span class="material-symbols-outlined">shapes</span></button></li>
   <li><button class="tools edit-text" data-tooltip="テキストを追加"><span class="material-symbols-outlined">insert_text</span></button></li>
   <li><button class="tools edit-graph" data-tooltip="グラフを追加"><span class="material-symbols-outlined">add_chart</span></button></li>
   <li><button class="tools edit-file" data-tooltip="ファイルをアップロード"><span class="material-symbols-outlined">upload</span></button></li>
  </ul>
 </div>
 <div class="mode-board">
  <ul>
   <li><button class="mode mode-see" data-tooltip="操作"><span class="material-symbols-outlined">arrow_selector_tool</span></button></li>
   <li><button class="mode mode-edit" data-tooltip="編集"><span class="material-symbols-outlined">edit_square</span></button></li>
   <li><button class="mode mode-matting" data-tooltip="マッチング"><span class="material-symbols-outlined">diagonal_line</span></button></li>
  </ul>
 </div>

  <div id="viewport" class="viewport">
   <div id="canvas" class="canvas">
       <div style="position:absolute; top:500px; left:500px;">中心の目印</div>
   </div>
  </div>
  <!--- コンテンツメニュー */ --->
 <div class="ContextMenu">
  <ul>
   <li><button class="ContextMenu-act act-paste"><span class="material-symbols-outlined">content_paste</span>ペースト</button></li>
   <li><button class="ContextMenu-act act-copy"><span class="material-symbols-outlined">content_copy</span>コピー</button></li>
   <li><button class="ContextMenu-act act-delete"><span class="material-symbols-outlined">delete</span>削除</button></li>
   <li><button class="ContextMenu-act act-layers"><span class="material-symbols-outlined">layers</span>レイヤー</button></li>
  </ul>
 </div>
 <!--- クイック挿入メニュー --->
 <div class="QuickMenu">
   <button class="QuickMenu-add add-text" data-tooltip="テキストを追加"><span class="material-symbols-outlined">text_increase</span></button>
   <button class="QuickMenu-add add-note" data-tooltip="付箋を追加"><span class="material-symbols-outlined">note_stack_add</span></button>
   <button class="QuickMenu-add add-pin" data-tooltip="ピンを追加"><span class="material-symbols-outlined">add_location</span></button>
   <button class="QuickMenu-add add-chert" data-tooltip="グラフを追加"><span class="material-symbols-outlined">add_chart</span></button>
   <button class="QuickMenu-add add-material" data-tooltip="素材を追加"><span class="material-symbols-outlined">sticker_add</span></button>
 </div>

 <script>
 
   /* header */ 
  document.querySelector(".rogo").addEventListener('click', function() { window.open("https://blue-ttt.github.io/plot/index.html", "_blank"); }); /* ホームへ移動 */
  
  document.querySelector(".help-btn").addEventListener('click', function() {const target = document.querySelector(".mini-study"); target.style.display = "block";}); /* ？ボタンが押されたらhelpを表示 */
  document.querySelector(".mini-study-close").addEventListener('click', function() {const target = document.querySelector(".mini-study"); target.style.display = "none";}); /* ×ボタンが押されたらhelpを非表示 */
  
  document.querySelector(".set-btn").addEventListener('click', function() {const target = document.querySelector(".mini-setting"); target.style.display = "block";}); /* ？ボタンが押されたらsettingを表示 */
  document.querySelector(".mini-setting-close").addEventListener('click', function() {const target = document.querySelector(".mini-setting"); target.style.display = "none";}); /* ×ボタンが押されたらsettingを非表示 */

  /* 題名入力欄の部分 */
  const titleEdit = document.querySelector('.title-edit');titleEdit.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
  e.preventDefault(); // 改行（Enter）の動作を無効化
    }});

   /* tool */ 
  const toolButtons = document.querySelectorAll(".toolbar .tools"); /* toolbarのボタンを取得 */ 

  toolButtons.forEach(button => {
  button.addEventListener('click', function() {
   toolButtons.forEach(btn => btn.classList.remove('active')); /* リセット（他のボタンには色がついているから） */ 
   this.classList.add('active'); /* activeを実行  */
    });
   toolButtons[0].classList.add('active'); /* 初期のtoolが「操作」だから */
   nowtool = "move";
   
  });
   document.querySelector(".edit-note").addEventListener('click', addStickyNote);
  
    /* mode */ 
  const modeButtons = document.querySelectorAll(".mode-board button"); /* modeのボタンを取得 */ 

  modeButtons.forEach(button => {
  button.addEventListener('click', function() {
   modeButtons.forEach(btn => btn.classList.remove('active')); /* リセット（他のボタンには色がついているから） */ 
   this.classList.add('active'); /* activeを実行 */
    });
   modeButtons[1].classList.add('active'); /* 初期のmodeが「編集」だから */
   nowmode = "edit";
  });

 /* --- canvas --- */
  
  /* 初期設定 */
let scale = 1.0; 
let posX = 0;    
let posY = 0;
const keys = {};

const content = document.getElementById("canvas");
const Keys = {};
 
 /* ---- 操作準備 ---- */
  
  /* --- ブラウザ全体でキーの「ON/OFF」を監視する --- */
window.addEventListener('keydown', (event) => {
  // キーが押されたら true にする
  keys[event.code] = true;
});

window.addEventListener('keyup', (event) => {
  /* キーが離されたら false にする */
  keys[event.code] = false;
});
  
/* --- 操作 --- */
  
 function update() {
 
  if (keys["ArrowRight"]) { posX -= 10; } 
  if (keys["ArrowLeft"])  { posX += 10; }
  if (keys["ArrowUp"])    { posY += 10; }
  if (keys["ArrowDown"])  { posY -= 10; }



  content.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; /* 座標の書き換え */
  
  requestAnimationFrame(update);
 }
  update(); /* 更新 */
  
  
/* --- 要素 --- */
  /* 付箋 */
function addStickyNote(){
  const sticky = document.createElement("div");  /* divを作成 */
  sticky.className = "sticky-note";

   /* データ */
   const newId = `note_${Date.now()}`; /* 新しいIDを作成 */
   const newData = {
   "id" : newId,
   "x" : "(poX)",
   "y" : "(posY)",
   "size" : "1.50",
   "type" : "note",
   "attributes" : {
    "color":"#fff9c4",
    "text-color":"#000",
      }
    };
    DataList.push(newData); /* データ集に追加 */
 
  sticky.innerHTML = '<textarea placeholder="メモを入力..."></textarea><div class="drag"><span class="material-symbols-outlined" style="font-size:20px; background-color:#fff; cursor:move; ">drag_pan</span></div> ';

  content.appendChild(sticky);

   /* 付箋の移動 */
   const handle = sticky.querySelector(".drag"); /* 移動のボタンを探す */
  handle.addEventListener('mousedown', (e) => {
    e.stopPropagation(); // 親（付箋）へのイベント伝達を止める
    isDragging = true;
   
    /* マウスと付箋の左上の距離を計算 */
    diffX = e.clientX - sticky.offsetLeft * scale;
    diffY = e.clientY - sticky.offsetTop * scale;
    
    sticky.style.zIndex = 1000;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;

    /* スケールを考慮して位置を更新 */
    const newX = (e.clientX - diffX) / scale;
    const newY = (e.clientY - diffY) / scale;

    sticky.style.left = `${newX}px`;
    sticky.style.top = `${newY}px`;
  });
  window.addEventListener('mouseup', () => {
    isDragging = false; /* マウスを離したら終了 */
    sticky.style.zIndex = 10;
  });
 } /* 付箋コードここまで */

/* コンテキストメニューの表示 */
  document.addEventListener('contextmenu', (event) => {
    event.preventDefault();  /* デフォルトのメニューが出るのを防ぐ */
    const target = document.querySelector('.ContextMenu');
    target.style.display = "block"; /* コンテキストメニューを表示 */
   const cursor = document.getElementById('cursor');
 });
  /* コンテキストメニューを非表示 */
  window.addEventListener('mousedown', (event) => {
    const target = document.querySelector('.ContextMenu');
    target.style.display = "none";
 });
  
 </script>

  .mini-setting-close{ top:-600px; }

  .ContextMenu{ background-color:#fff; box-shadow:0px 0px 5px 1px #8A8C8E; width:200px; height:auto; border-radius:20px; padding:0; margin:0; display:none; }

  .sticky-note { position: absolute;/* 自由位置へ */ width: 150px; height: 150px; background-color:#fff9c4; /* 薄い黄色 */ box-shadow:2px 2px 10px rgba(0,0,0,0.2); padding:10px; border-radius:5px; display:flex;  }
  .sticky-note textarea{ width:100%; height:100%; background-color:#ffffff00; border:none; outline:none; margin:0; } /* 付箋の入力欄のところ */
