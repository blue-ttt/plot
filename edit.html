 <script>
  // 読み込み中画面
  window.addEventListener('load', () => {
   const afterLoading = document.querySelector('.loading-edit-page');
   afterLoading.style.display = 'none';
  });
  // モードの初期設定
  const modeButtons = document.querySelectorAll(".mode-board .mode"); /* modeのボタンを取得 */ 
  
  /* 題名入力欄の部分 */
  const titleEdit = document.querySelector('.title-edit');titleEdit.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
  e.preventDefault(); // 改行（Enter）の動作を無効化
    }});
  // toolbarのボタンを押したときの処理
   // toolbar-アクティブエリア
   const toolButtons_activearea = document.querySelectorAll(".toolbar-choose-area .tools"); /* toolbarのtoolbar-choose-areaのボタンを取得 */ 
   // 
   const toolButtons_OnOffarea = document.querySelectorAll(".toolbar-OnOff-area .tools");
  
  toolButtons_activearea.forEach(button => {
  button.addEventListener('click', function() {
   toolButtons_activearea.forEach(btn => btn.classList.remove('nowTools')); /* リセット（他のボタンには色がついているから） */ 
   this.classList.add('nowTools'); /* activeを実行  */

   console.log(`現在のモード: ${nowmode}, 現在のツール: ${nowtool}`);

  // --- サブツール ---
  const subToolsHtml = document.querySelectorAll('.subTools');

  if (nowtool.includes('note') || nowtool.includes('text') && nowmode.includes('eng') || nowtool.includes('pin') || nowtool.includes('material')  ) {

    const thisSubToolsHtml = document.querySelector('.subTools-' + nowtool);

    document.documentElement.style.setProperty('--toolbarWidth', '90px');
    subToolsHtml.forEach(el => el.style.display = 'none');
    if(thisSubToolsHtml){ thisSubToolsHtml.style.display = 'flex'; }

  } else {

    document.documentElement.style.setProperty('--toolbarWidth', '45px');
    subToolsHtml.forEach(el => el.style.display = 'none');
  };
 
    });
   toolButtons_activearea[0].classList.add('nowTools'); /* 初期のtoolが「操作」だから */
   nowtool = "move";
  });
 

  

  // --- モード機能 ----
  // モードの初期設定

  modeButtons.forEach(button => {
  // 最初のモード(ひらめきモード)を選択済みにする
   modeButtons[0].classList.add('nowMode'); /* 初期のmodeが「編集」だから */
   nowmode = "edit";
  });
  // モードを切り替える関数
  function changeMode(mode) {

    modeButtons.forEach(btn => btn.classList.remove('nowMode')); /* リセット（他のボタンには色がついているから） */ 
    if (mode === 'idea') {
      modeButtons[0].classList.add('nowMode');
      nowmode = "idea"; /* モードを「ひらめき」にする */

      document.body.classList.remove('PlotMode-engineer'); /* bodyのclassを「くみたてモード」にする */
      document.body.classList.add('PlotMode-idea');

    } else if (mode === 'engineer') {
      modeButtons[1].classList.add('nowMode');
      nowmode = "eng"; /* モードを「くみたて」にする */
      
      document.body.classList.remove('PlotMode-idea');
      document.body.classList.add('PlotMode-engineer'); /* bodyのclassを「くみたてモード」にする */

    } 
    console.log(`現在のモード: ${nowmode}, 現在のツール: ${nowtool}`);
  };
  // シンプルスタイル調節を取得(data.jsで使う)
  const simpleStyleBar = document.querySelector('.simple-style-bar');

 // --- canvas ---
  
  // 初期設定
let scale = 1.0; 
let posX = 0;    
let posY = 0;
const pushKey = new Set();

const canvas = document.getElementById("canvas");
  
  // --- ブラウザ全体でキーの「ON/OFF」を監視する ---
window.addEventListener('keydown', (event) => {
  const keyName = event.key.toLowerCase();
  pushKey.add(keyName);

  if (!event.repeat) {
    const isCmd = event.metaKey;
    const isCtrl = event.ctrlKey;
    if(!selectElement){
    // 画面のショートカットキー
      if (isCmd && keyName === "v") { console.log("ペースト"); }
      if (isCmd && keyName ==="m") { event.preventDefault(); addComent(); console.log("コメント"); }
      if (isCmd && isCtrl && keyName === "n") { event.preventDefault(); addElement_note("#fff"); }
      if (keyName === "F1") { event.preventDefault(); HelpDisplay(); }
    }
    //要素のショートカットキー
    if (selectElement) {
      if (keyName === "delete") { DeleteElement(); }
      if (isCmd && keyName === "m") { event.preventDefault(); addComent(); console.log("要素コメント"); }
      if (isCmd && keyName === "d") { event.preventDefault(); Reproduction(); }
    }
  }
});
//キーが話された時
window.addEventListener('keyup', (event) => {

  pushKey.delete(event.key.toLowerCase());
});
  
/* --- 画面の操作 --- */
  
 function update() {
 
  if (!selectElement) {
    if (pushKey.has("arrowright")) { posX -= 10; } 
    if (pushKey.has("arrowleft"))  { posX += 10; }
    if (pushKey.has("arrowup"))    { posY += 10; }
    if (pushKey.has("arrowdown"))  { posY -= 10; }
    if (pushKey.has(";")) { scale += 0.01; scaleChange(); }
    if (pushKey.has("-")) { scale -= 0.01; scaleChange(); }

    //小さく(大きく)なりすぎ防止
    if (scale < 0.1) scale = 0.1;
    if (scale > 5) scale= 5;

    // cssへ書き換え
    if (canvas) {canvas.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;} /* 座標の書き換え */
    
  
  }
  requestAnimationFrame(update);
 };
  update();
   
 </script>
