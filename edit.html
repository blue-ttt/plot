 <script>
  document.addEventListener('DOMContentLoaded', () => {
   const afterLoading = document.querySelector('.loading-edit-page');
   afterLoading.style.display = 'none';
  });
   /* header */ 
  document.querySelector(".rogo").addEventListener('click', function() { window.open("https://blue-ttt.github.io/plot/index.html", "_blank"); }); /* ホームへ移動 */
  
  /* 題名入力欄の部分 */
  const titleEdit = document.querySelector('.title-edit');titleEdit.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
  e.preventDefault(); // 改行（Enter）の動作を無効化
    }});

   /* tool */ 
  const toolButtons = document.querySelectorAll(".toolbar .tools"); /* toolbarのボタンを取得 */ 

  toolButtons.forEach(button => {
  button.addEventListener('click', function() {
   toolButtons.forEach(btn => btn.classList.remove('active')); /* リセット（他のボタンには色がついているから） */ 
   this.classList.add('active'); /* activeを実行  */
    });
   toolButtons[0].classList.add('active'); /* 初期のtoolが「操作」だから */
   nowtool = "move";
   
  });
   document.querySelector(".edit-note").addEventListener('click', addStickyNote);
  
    /* mode */ 
  const modeButtons = document.querySelectorAll(".mode-board button"); /* modeのボタンを取得 */ 

  modeButtons.forEach(button => {
  button.addEventListener('click', function() {
   modeButtons.forEach(btn => btn.classList.remove('active')); /* リセット（他のボタンには色がついているから） */ 
   this.classList.add('active'); /* activeを実行 */
    });
   modeButtons[1].classList.add('active'); /* 初期のmodeが「編集」だから */
   nowmode = "edit";
  });

 /* --- canvas --- */
  
  /* 初期設定 */
let scale = 1.0; 
let posX = 0;    
let posY = 0;
const keys = {};

const content = document.getElementById("canvas");
const Keys = {};
 
 /* ---- 操作準備 ---- */
  
  /* --- ブラウザ全体でキーの「ON/OFF」を監視する --- */
window.addEventListener('keydown', (event) => {
  // キーが押されたら true にする
  keys[event.code] = true;
});

window.addEventListener('keyup', (event) => {
  /* キーが離されたら false にする */
  keys[event.code] = false;
});
  
/* --- 操作 --- */
  
 function update() {
 
  if (keys["ArrowRight"]) { posX -= 10; } 
  if (keys["ArrowLeft"])  { posX += 10; }
  if (keys["ArrowUp"])    { posY += 10; }
  if (keys["ArrowDown"])  { posY -= 10; }


  content.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; /* 座標の書き換え */
  
  requestAnimationFrame(update);
 }
  update(); /* 更新 */
  
  
/* --- 要素 --- */
  /* 付箋 */
function addStickyNote(){
  const sticky = document.createElement("div");  /* divを作成 */
  sticky.className = "sticky-note";

   /* データ */
   const newId = `note_${Date.now()}`; /* 新しいIDを作成 */
   const newData = {
   "id" : newId,
   "x" : "(poX)",
   "y" : "(posY)",
   "size" : "1.50",
   "type" : "note",
   "attributes" : {
    "color":"#fff9c4",
    "text-color":"#000",
      }
    };
    DataList.push(newData); /* データ集に追加 */
 
  sticky.innerHTML = '<textarea placeholder="メモを入力..."></textarea><div class="drag"><span class="material-symbols-outlined" style="font-size:20px; background-color:#fff; cursor:move; ">drag_pan</span></div> ';

  content.appendChild(sticky);

   /* 付箋の移動 */
   const handle = sticky.querySelector(".drag"); /* 移動のボタンを探す */
  handle.addEventListener('mousedown', (e) => {
    e.stopPropagation(); // 親（付箋）へのイベント伝達を止める
    isDragging = true;
   
    /* マウスと付箋の左上の距離を計算 */
    diffX = e.clientX - sticky.offsetLeft * scale;
    diffY = e.clientY - sticky.offsetTop * scale;
    
    sticky.style.zIndex = 1000;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;

    /* スケールを考慮して位置を更新 */
    const newX = (e.clientX - diffX) / scale;
    const newY = (e.clientY - diffY) / scale;

    sticky.style.left = `${newX}px`;
    sticky.style.top = `${newY}px`;
  });
  window.addEventListener('mouseup', () => {
    isDragging = false; /* マウスを離したら終了 */
    sticky.style.zIndex = 10;
  });
 } /* 付箋コードここまで */
   
 </script>
</body>
